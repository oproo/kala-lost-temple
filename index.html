<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KĀLA: The Lost Temple</title>
<link rel="stylesheet" href="style.css?v=controls-4">
<style id="kala-touch-controls-v4">
html,body{width:100%;height:100%;margin:0;overflow:hidden}
#controls{position:fixed!important;inset:0!important;z-index:9999!important;pointer-events:none!important}
#controls button{position:absolute!important;box-sizing:border-box!important;width:76px!important;height:76px!important;margin:0!important;padding:0!important;border:2px solid rgba(235,235,235,.48)!important;border-radius:50%!important;background:transparent!important;color:#fff!important;display:flex!important;align-items:center!important;justify-content:center!important;font:700 22px/1 Arial,sans-serif!important;text-shadow:0 1px 5px #000!important;box-shadow:none!important;pointer-events:auto!important;-webkit-appearance:none!important;appearance:none!important}
#controls .controlLabel{position:absolute!important;display:block!important;color:rgba(255,255,255,.46)!important;font:700 10px/12px Arial,sans-serif!important;letter-spacing:3px!important;text-align:center!important;white-space:nowrap!important;text-shadow:0 1px 5px #000!important}
#controls .movePad{position:absolute!important;left:18px!important;bottom:max(22px,env(safe-area-inset-bottom))!important;width:190px!important;height:205px!important;transform:none!important}
#controls #jumpBtn{left:57px!important;top:0!important}
#controls #leftBtn{left:0!important;top:86px!important}
#controls #rightBtn{left:114px!important;top:86px!important}
#controls .dpad.down{left:57px!important;top:172px!important}
#controls .movePad>.controlCluster{position:absolute!important;left:0!important;top:0!important;width:190px!important;height:205px!important}
#controls .movePad>.controlCluster>.controlLabel{left:57px!important;top:208px!important;width:76px!important}
#controls .actionPad{position:absolute!important;right:18px!important;bottom:max(22px,env(safe-area-inset-bottom))!important;width:190px!important;height:205px!important;transform:none!important}
#controls .actionCluster{position:absolute!important;width:76px!important;height:96px!important;margin:0!important;padding:0!important;pointer-events:none!important}
#controls .actionCluster.top{left:0!important;top:0!important}
#controls .actionCluster.attack{right:0!important;top:0!important}
#controls .actionCluster.dash{left:0!important;bottom:0!important}
#controls .actionCluster.use{right:0!important;bottom:0!important}
#controls .actionCluster .actionBtn{left:0!important;top:0!important}
#controls .actionCluster .controlLabel{left:50%!important;top:80px!important;transform:translateX(-50%)!important}
#controls #attackBtn{width:82px!important;height:82px!important;left:-3px!important;top:-3px!important}
#controls .attack .controlLabel{top:86px!important}
@media(min-width:700px){
 #controls .movePad{left:clamp(28px,7.8vw,120px)!important}
 #controls .actionPad{right:clamp(28px,7.8vw,120px)!important}
}
</style><style id="kala-landscape-start">
#landscapeGate{display:none;position:fixed;inset:0;z-index:100000;background:#07110b;color:#fff;align-items:center;justify-content:center;text-align:center;padding:32px;font-family:Arial,sans-serif}
#landscapeGate .gateInner{max-width:520px}
#landscapeGate .icon{font-size:58px;margin-bottom:18px}
#landscapeGate h1{font-size:28px;margin:0 0 10px}
#landscapeGate p{font-size:15px;opacity:.72;margin:0}
#startScreen{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#07110b;color:#fff;font-family:Arial,sans-serif}
#startScreen .startInner{text-align:center;width:min(92vw,520px)}
#startScreen .logo{font-size:clamp(34px,8vw,64px);font-weight:800;letter-spacing:4px;text-shadow:0 3px 18px #000;margin-bottom:8px}
#startScreen .subtitle{font-size:14px;letter-spacing:4px;opacity:.68;margin-bottom:32px}
#playNowBtn{appearance:none;border:1px solid rgba(255,255,255,.65);background:rgba(0,0,0,.22);color:#fff;border-radius:999px;padding:16px 46px;font:700 16px Arial,sans-serif;letter-spacing:3px;box-shadow:0 4px 24px rgba(0,0,0,.35);cursor:pointer}
#playNowBtn:active{transform:scale(.96)}
body.game-started #startScreen{display:none}
@media(orientation:portrait){
  #landscapeGate{display:flex}
  #startScreen{display:none!important}
}
@media(orientation:landscape){
  #landscapeGate{display:none!important}
}
</style><style id="kala-top-left-controls">
@media(orientation:landscape){
  #controls .movePad{
    left:24px!important;
    top:max(24px,env(safe-area-inset-top))!important;
    bottom:auto!important;
    transform:none!important;
  }
}
</style></head>
<body>
<div id="landscapeGate"><div class="gateInner"><div class="icon">↻</div><h1>LANDSCAPE MODE</h1><p>Rotate your device sideways to play KĀLA: The Lost Temple.</p></div></div>
<div id="startScreen"><div class="startInner"><div class="logo">KĀLA</div><div class="subtitle">THE LOST TEMPLE</div><button id="playNowBtn" type="button">PLAY NOW</button></div></div><canvas id="game"></canvas>

<div id="controls">
  <div class="movePad">
    <div class="controlCluster">
      <button id="jumpBtn" class="dpad up" aria-label="Jump">▲</button>
      <button id="leftBtn" class="dpad left" aria-label="Move left">◀</button>
      <button id="rightBtn" class="dpad right" aria-label="Move right">▶</button>
      <button class="dpad down" aria-label="Crouch">▼</button>
      <span class="controlLabel">MOVE</span>
    </div>
  </div>

  <div class="actionPad">
    <div class="actionCluster top">
      <button id="weaponBtn" class="actionBtn weapon" aria-label="Weapon">⚔</button>
      <span class="controlLabel">WEAPON</span>
    </div>

    <div class="actionCluster attack">
      <button id="attackBtn" class="actionBtn attackBtn" aria-label="Attack">⚔</button>
      <span class="controlLabel">ATTACK</span>
    </div>

    <div class="actionCluster dash">
      <button id="dashBtn" class="actionBtn" aria-label="Dash">◆</button>
      <span class="controlLabel">DASH</span>
    </div>

    <div class="actionCluster use">
      <button id="interactBtn" class="actionBtn" aria-label="Use">E</button>
      <span class="controlLabel">USE</span>
    </div>
  </div>
</div>

<div id="message">KĀLA • THE LOST TEMPLE</div>
<script src="game-v17.js?v=start-1"></script><script>document.getElementById("playNowBtn").addEventListener("click",()=>window.startKalaGame());</script>
</body>
</html>
