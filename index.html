<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07110b">
  <title>KĀLA: The Lost Temple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="gameShell">
  <canvas id="game" aria-label="KALA The Lost Temple game"></canvas>

  <section id="menu" class="screen">
    <div class="card">
      <div class="eyebrow">A SRI LANKAN FANTASY ADVENTURE</div>
      <h1>KĀLA</h1>
      <h2>THE LOST TEMPLE</h2>
      <p>Enter the jungle, recover the three sacred relics and awaken the guardian.</p>
      <button id="playNow" type="button">PLAY NOW</button>
      <div class="controlsHint">WASD / ARROWS · SPACE ATTACK · SHIFT DASH · E INTERACT</div>
    </div>
  </section>

  <section id="hud" aria-hidden="true">
    <div class="hudBox">
      <strong>KĀLA: THE LOST TEMPLE</strong>
      <span id="stats">Relics: 0/3 · Score: 0 · HP: 100</span>
    </div>
    <div id="objective">Find the 3 sacred relics</div>
  </section>

  <section id="touchControls" aria-hidden="true">
    <div class="dpad">
      <button class="ctrl up" data-key="w" aria-label="Move up">▲</button>
      <button class="ctrl left" data-key="a" aria-label="Move left">◀</button>
      <button class="ctrl down" data-key="s" aria-label="Move down">▼</button>
      <button class="ctrl right" data-key="d" aria-label="Move right">▶</button>
    </div>
    <div class="actions">
      <button class="ctrl attack" data-action="attack" aria-label="Attack">⚔</button>
      <button class="ctrl dash" data-action="dash" aria-label="Dash">◆</button>
      <button class="ctrl interact" data-action="interact" aria-label="Interact">E</button>
    </div>
  </section>

  <div id="message"></div>
</main>
<script src="game.js"></script>
</body>
</html>
