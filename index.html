<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KĀLA: The Lost Temple</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
body{font-family:Arial,sans-serif}#game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;background:#111;touch-action:none}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}
button{pointer-events:auto;width:64px;height:64px;border:2px solid #fff;border-radius:16px;background:rgba(20,20,20,.85);color:#fff;font:bold 24px Arial;touch-action:none}
.move{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
.actions{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
#status{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:11;color:#fff;background:rgba(0,0,0,.7);padding:7px 12px;border-radius:10px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="status">KĀLA • SHAPE TEST</div>
<div id="controls">
<div class="move"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button></div>
<div class="actions"><button id="attack" aria-label="Attack">⚔</button><button id="dash" aria-label="Dash">➜</button><button id="interact" aria-label="Interact">E</button></div>
</div>
<script>
(function(){
'use strict';
var c=document.getElementById('game'),x=c.getContext('2d'),W=0,H=0,d=1;
var p={x:160,y:0,attack:0,dash:0},L=0,R=0,last=performance.now();
function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,Math.floor(W*d));c.height=Math.max(1,Math.floor(H*d));c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0);p.y=H-125;p.x=Math.max(40,Math.min(W-40,p.x));}
function hold(el,set){['pointerdown','touchstart'].forEach(function(t){el.addEventListener(t,function(e){e.preventDefault();set(true)},{passive:false})});['pointerup','pointercancel','pointerleave','touchend'].forEach(function(t){el.addEventListener(t,function(e){e.preventDefault();set(false)},{passive:false})});}
hold(document.getElementById('left'),function(v){L=v});hold(document.getElementById('right'),function(v){R=v});
document.getElementById('attack').addEventListener('pointerdown',function(e){e.preventDefault();p.attack=.2});
document.getElementById('dash').addEventListener('pointerdown',function(e){e.preventDefault();p.dash=.25});
document.getElementById('interact').addEventListener('pointerdown',function(e){e.preventDefault();document.getElementById('status').textContent='INTERACT WORKS'});
addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')L=1;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')R=1;if(e.code==='Space')p.attack=.2;if(e.key==='Shift')p.dash=.25});
addEventListener('keyup',function(e){if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')L=0;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')R=0});
addEventListener('resize',resize);
function draw(){
x.clearRect(0,0,W,H);x.fillStyle='#07110b';x.fillRect(0,0,W,H);
x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,p.y+25,W,2);
x.fillStyle='#d8a33b';x.beginPath();x.arc(p.x,p.y,24,0,Math.PI*2);x.fill();
x.fillStyle='#111';x.beginPath();x.arc(p.x-8,p.y-5,3,0,Math.PI*2);x.arc(p.x+8,p.y-5,3,0,Math.PI*2);x.fill();
if(p.attack>0){x.strokeStyle='#f4d27a';x.lineWidth=8;x.beginPath();x.arc(p.x+28,p.y,30,-.8,.8);x.stroke()}
x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText('KĀLA',p.x,p.y+45);
}
function loop(t){var dt=Math.min((t-last)/1000,.033);last=t;var dir=(R?1:0)-(L?1:0),speed=p.dash>0?620:260;p.x=Math.max(40,Math.min(W-40,p.x+dir*speed*dt));p.attack=Math.max(0,p.attack-dt);p.dash=Math.max(0,p.dash-dt);draw();requestAnimationFrame(loop)}
resize();draw();requestAnimationFrame(loop);
})();
</script>
</body></html>
