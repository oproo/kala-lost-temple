<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KĀLA: The Lost Temple</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="controls">
  <div class="movePad">
    <button id="leftBtn" aria-label="Move left">◀</button>
    <button id="rightBtn" aria-label="Move right">▶</button>
  </div>
  <div class="actionPad">
    <button id="attackBtn" aria-label="Attack">⚔</button>
    <button id="dashBtn" aria-label="Dash">➜</button>
    <button id="interactBtn" aria-label="Interact">E</button>
  </div>
</div>

<div id="message">KĀLA • THE LOST TEMPLE</div>
<script src="game-v16.js"></script>
</body>
</html>
