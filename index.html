<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KĀLA: The Lost Temple</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="controls">
  <div class="movePad">
    <div class="controlCluster">
      <button id="jumpBtn" class="dpad up" aria-label="Jump">▲</button>
      <button id="leftBtn" class="dpad left" aria-label="Move left">◀</button>
      <button id="rightBtn" class="dpad right" aria-label="Move right">▶</button>
      <button class="dpad down" aria-label="Crouch">▼</button>
      <span class="controlLabel">MOVE</span>
    </div>
  </div>

  <div class="actionPad">
    <div class="actionCluster top">
      <button id="weaponBtn" class="actionBtn weapon" aria-label="Weapon">⚔</button>
      <span class="controlLabel">WEAPON</span>
    </div>

    <div class="actionCluster attack">
      <button id="attackBtn" class="actionBtn attackBtn" aria-label="Attack">⚔</button>
      <span class="controlLabel">ATTACK</span>
    </div>

    <div class="actionCluster dash">
      <button id="dashBtn" class="actionBtn" aria-label="Dash">◆</button>
      <span class="controlLabel">DASH</span>
    </div>

    <div class="actionCluster use">
      <button id="interactBtn" class="actionBtn" aria-label="Use">E</button>
      <span class="controlLabel">USE</span>
    </div>
  </div>
</div>

<div id="message">KĀLA • THE LOST TEMPLE</div>
<script src="game-v17.js?v=controls-3"></script>
</body>
</html>
